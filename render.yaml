services:
  - type: web
    name: studio-lt-concept
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_REMINDER_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_QUOTE_CONTACT_TEMPLATE_NAME
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true

  - type: cron
    name: studio-lt-concept-reminders
    runtime: node
    plan: starter
    schedule: "0 * * * *" # a cada hora
    buildCommand: "echo 'no build needed'"
    # APP_URL deve ser a URL pública do serviço web acima (ex.: https://studio-lt-concept.onrender.com)
    startCommand: "curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" \"$APP_URL/api/cron/reminders\""
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: studio-lt-concept
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false
